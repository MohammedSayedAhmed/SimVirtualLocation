name: Checks
on:
  push:
    branches: ["main", "claude/**"]
  # Without this the logic tests never ran on a pull request — the one place a
  # regression most needs catching before it reaches main.
  pull_request:
jobs:
  logic-tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  build:
    # Build only where build.yml will not: it already compiles every push to main
    # (it publishes the release from that build) and every pull request. Running
    # both meant compiling the app twice for the same commit.
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcodebuild build -project SimVirtualLocation.xcodeproj -scheme SimVirtualLocation \
            -configuration Debug -destination 'platform=macOS' ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= CODE_SIGN_ENTITLEMENTS=
